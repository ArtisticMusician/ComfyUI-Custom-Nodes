[project]
name = "one-solo-studios"
version = "1.0.2"
description = "Ensemble stem separation with UVR and SAM Audio, curated models, Audio2MIDI, Stem save node, waveform render for IO nodes, other utility nodes. Dependencies are not installed automatically. Install audio-separator and basic-pitch per INSTALL.md."
license = { text = "MIT" }
requires-python = ">=3.10"

